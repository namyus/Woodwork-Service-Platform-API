
# --- Render ---
server.port=${PORT:10000}
server.address=0.0.0.0

# --- TiDB Cloud / MySQL ---
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

logging.level.org.springframework.security=INFO

# --- JWT ---
app.jwt-secret=${APP_JWT_SECRET}
app.jwt-access-expiration-milliseconds=${JWT_ACCESS_EXPIRATION_MS:86400000}
app.jwt-refresh-expiration-milliseconds=${JWT_REFRESH_EXPIRATION_MS:604800000}

# --- Resend ---
resend.api-key=${RESEND_API_KEY}
resend.from-email=${RESEND_FROM_EMAIL}

# --- VNPay ---
vnpay.tmnCode=${VNPAY_TMN_CODE}
vnpay.version=2.1.0
vnpay.command=pay
vnpay.secretKey=${VNPAY_SECRET_KEY}